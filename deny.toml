# -----------------------------------------------------------------------------
# Filename:    traces-pkm/deny.toml
# Docs:        https://embarkstudios.github.io/cargo-deny/
# Description: cargo-deny configuration for license, ban, advisory, and source
#              checks on the dependency graph.
# -----------------------------------------------------------------------------

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
]

[[bans.skip]]
name = "convert_case"
reason = "derive_more pins 0.10, we use 0.11"

[[bans.skip]]
name = "unicode-width"
reason = "miette pins 0.1.x, others use 0.2.x"

[[bans.skip]]
name = "syn"
version = "2.0"
reason = "proc-macro ecosystem mid-migration to syn 3: 2.x still pinned by derive_more, indextree, logos, miette, phf, rstest, strum, tracing, windows, zerocopy; drop when upstreams migrate"
