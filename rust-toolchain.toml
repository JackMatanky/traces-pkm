# -----------------------------------------------------------------------------
# Filename:    rust-toolchain.toml
# Docs:        https://rust-lang.github.io/rustup/overrides.html#the-toolchain-file
# Description: Pins the Rust toolchain version and components for the workspace
#              to ensure deterministic builds and formatting. Keep in sync with
#              the `rust` entry in mise.toml (mise overrides via RUSTUP_TOOLCHAIN).
# -----------------------------------------------------------------------------

[toolchain]
channel = "nightly-2026-09-09"
profile = "minimal"
components = ["clippy", "rustfmt"]
