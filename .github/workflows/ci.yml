---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MISE_YES: "1"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: mise install rust
      - run: mise install hk taplo gitleaks cargo:cargo-deny cargo:cargo-audit cargo:ryl
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-${{ matrix.os }}"
      - run: mise run check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: mise install rust cargo:cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: mise run test

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: |
          msrv=$(cargo metadata --format-version 1 | jq -r '.packages[0].rust_version')
          mise install "rust@${msrv}"
          mise exec "rust@${msrv}" -- cargo check --workspace --all-features

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: mise install rust
      - uses: Swatinem/rust-cache@v2
      - run: mise run doc
