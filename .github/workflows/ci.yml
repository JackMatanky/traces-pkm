---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MISE_EXPERIMENTAL: "1"
  MISE_YES: "1"
  MISE_AUTO_INSTALL: "0"
  RUSTUP_AUTO_INSTALL: "0"

jobs:
  platform-check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "platform-check-${{ matrix.os }}"
      - run: mise exec -- cargo check --workspace --all-targets --all-features

  hk:
    name: hk checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "hk-ubuntu"
      - run: mise install --locked taplo gitleaks cargo:cargo-deny cargo:cargo-audit cargo:ryl
      - run: mise install --locked hk
      - run: mise exec -- hk validate
      - run: mise exec -- hk check --all --no-fail-fast --format jsonl --skip-step cargo-clippy --skip-step cargo-test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - run: mise install --locked cargo:cargo-nextest
      - run: mise run test

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy-ubuntu"
      - run: mise exec -- cargo clippy --workspace --all-targets --all-features -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install: false
      - id: msrv
        run: |
          msrv="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')"
          echo "version=${msrv}" >> "${GITHUB_OUTPUT}"
      - run: mise install "rust@${{ steps.msrv.outputs.version }}"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "msrv-${{ steps.msrv.outputs.version }}"
      - run: mise exec "rust@${{ steps.msrv.outputs.version }}" -- cargo check --workspace --all-features

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - run: mise run doc
