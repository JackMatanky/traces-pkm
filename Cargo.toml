# -----------------------------------------------------------------------------
# Filename:    traces-pkm/Cargo.toml
# Docs:        https://doc.rust-lang.org/cargo/reference/manifest.html
# Description: Workspace manifest for the Traces Rust project, defining
#              package metadata, dependencies, and workspace-wide lints.
# -----------------------------------------------------------------------------

# ------------------------------------------------------------- #
#                           Package                             #
# ------------------------------------------------------------- #
[package]
name = "traces-pkm"
version = "0.1.0"
edition = "2024"
description = "Personal knowledge management traces"
readme = "README.md"
repository = "https://github.com/JackMatanky/traces-pkm"
license = "MIT"
keywords = ["notes", "pkm", "templates"]
categories = ["command-line-utilities", "development-tools"]

# ------------------------------------------------------------- #
#                            Benchmarks                         #
# ------------------------------------------------------------- #
[[bench]]
harness = false
name = "codec"

[[bench]]
harness = false
name = "hash"

[[bench]]
harness = false
name = "index_lifecycle"

[[bench]]
harness = false
name = "index_query"

[[bench]]
harness = false
name = "note_parsing"

[[bench]]
harness = false
name = "template_render"

# ------------------------------------------------------------- #
#                         Dependencies                          #
# ------------------------------------------------------------- #
[dependencies]
bit-vec = "0.10"
blake3 = "1.8"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.7"
comfy-table = { version = "7.2.2", default-features = false }
convert_case = "0.11.0"
figment = { version = "0.10", features = ["toml"] }
indexmap = { version = "2.14", features = ["serde"] }
inquire = "0.9"
logos = "0.16"
miette = { version = "7.6.0", features = ["derive", "fancy"] }
minijinja = "2.21.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
pulldown-cmark = "0.13"
redb = "4.1"
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
uuid = { version = "1.24.0", features = ["v4"] }
walkdir = "2.5"
yaml_serde = { package = "yaml_serde", version = "0.10" }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
pretty_assertions = "1.4.1"
rstest = "0.24"
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# ------------------------------------------------------------- #
#                          Features                             #
# ------------------------------------------------------------- #
[features]
test-utils = []

# ------------------------------------------------------------- #
#                          Lint Config                          #
# ------------------------------------------------------------- #
[lints.clippy]
# ------------------------------------------------------------- #
#                        Lint Categories                        #
# ------------------------------------------------------------- #
cargo = { level = "warn", priority = -1 }
complexity = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "deny", priority = -1 }

# ------------------------------------------------------------- #
#                 Denials (Strict Enforcements)                 #
# ------------------------------------------------------------- #
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_pointer_underscore = "deny"
as_underscore = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
exit = "deny"
expect_used = "deny"
fn_params_excessive_bools = "deny"
indexing_slicing = "deny"
large_types_passed_by_value = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
panic = "deny"
panic_in_result_fn = "deny"
print_stdout = "deny"
shadow_unrelated = "deny"
str_to_string = "deny"
struct_excessive_bools = "deny"
todo = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unused_self = "deny"
unwrap_used = "deny"

# ------------------------------------------------------------- #
#            Warnings (Best Practices & Suggestions)            #
# ------------------------------------------------------------- #
as_conversions = "warn"
cognitive_complexity = "warn"
else_if_without_else = "warn"
format_push_string = "warn"
impl_trait_in_params = "warn"
large_stack_frames = "warn"
literal_string_with_formatting_args = "warn"
missing_inline_in_public_items = "warn"
needless_collect = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
redundant_clone = "warn"
search_is_some = "warn"
significant_drop_in_scrutinee = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
use_self = "warn"

# ------------------------------------------------------------- #
#              Allowed (Exceptions & Relaxations)               #
# ------------------------------------------------------------- #
absolute_paths = "allow"
min_ident_chars = "allow"
missing_docs_in_private_items = "allow"
mod_module_files = "allow"
multiple_crate_versions = "allow"
print_stderr = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
semicolon_inside_block = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
single_call_fn = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
unseparated_literal_suffix = "allow"

# ------------------------------------------------------------- #
#                        Build Profiles                         #
# ------------------------------------------------------------- #
[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1
