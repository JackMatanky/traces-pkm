# .cargo/mutants.toml
# Configuration for cargo-mutants (https://mutants.rs)

test_tool = "nextest"
features = ["test-utils"]
additional_cargo_test_args = ["--all-targets"]

# Exclude CLI, main binary, and error definitions to focus on core business logic
# and avoid mutating code that is primarily boilerplate or presentation.
exclude_globs = [
  "src/main.rs",
  "src/cli/**/*.rs",
  "src/**/error.rs",
]

# Exclude boilerplate trait implementations and serialization adapters
exclude_re = [
  "fn main",
  "impl.*Debug",
  "impl.*Display",
  "impl.*Default",
  "impl.*PartialEq",
  "impl.*From",
  "impl.*TryFrom",
  "impl.*Serialize",
  "impl.*Deserialize",
  "impl.*Visitor",
]

# Keep timeouts close to cargo-mutants defaults, with a wider floor for local load.
timeout_multiplier = 5
minimum_test_timeout = 30
