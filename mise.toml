# -----------------------------------------------------------------------------
# Filename:    traces-pkm/mise.toml
# Docs:        https://mise.jdx.dev/
# Description: Project-wide tool versioning and task orchestration
# -----------------------------------------------------------------------------

[tools]
# -- Toolchain --
rust = { version = "nightly-2026-09-09", profile = "minimal", components = [
  "clippy",
  "rustfmt",
] }
hk = "2.0.0"
cargo-binstall = "latest"

# -- Data formats --
taplo = "latest"
tombi = "latest"
"cargo:ryl" = { version = "latest", install_env = { RUSTUP_TOOLCHAIN = "nightly-2026-09-09" } }

# -- Security --
gitleaks = "latest"
cargo-deny = "latest"
"cargo:cargo-audit" = "latest"

# -- Testing & Quality --
"github:nextest-rs/nextest" = "latest"
"cargo:cargo-tarpaulin" = "latest"
"cargo:cargo-crap" = "latest"
"cargo:cargo-mutants" = "latest"

# -- Benchmarking --
"cargo:critcmp" = "latest"

# -- Dev experience --
"cargo:cargo-watch" = "latest"
"cargo:cargo-sweep" = "latest"

# -- Docs & ADRs --
"cargo:https://github.com/snowmead/rust-docs-mcp" = { version = "branch:main", crate = "rust-docs-mcp" }
"cargo:adrs" = { version = "latest", install_env = { RUSTUP_TOOLCHAIN = "nightly-2026-09-09" } }

[settings]
# Pin resolved "latest" tool versions (hk, taplo, gitleaks, cargo:* subcommands)
# into mise.lock so installs are reproducible across machines and CI.
lockfile = true
task.disable_spec_from_run_scripts = true
experimental = true

[env]
HK_MISE = "1"
ADR_DIRECTORY = "docs/adr/"

[task_config]
global_inputs = ["mise.toml", "Cargo.lock", "clippy.toml"]

[task_config.cache]
# Global default for "build if stale" tasks whose declared sources cover every
# input that can change the result. Opt out per task with cache = { enabled =
# false } when either:
#   1. inputs are incomplete (check/fmt declare no rust sources; a skip would
#      let stale code pass the gate), or
#   2. the task means "execute now" (lint/test/sweep/verify are gates that must
#      run on invocation; clean/setup are destructive or install actions that
#      must never be skipped as "fresh"; watch is an interactive session).
enabled = true

[task_config.input_groups]
rust = ["Cargo.toml", "Cargo.lock", "clippy.toml", "src/**/*.rs", "tests/**/*.rs"]
bench = ["Cargo.toml", "Cargo.lock", "clippy.toml", "src/**/*.rs", "benches/**/*.rs"]

# ------------------------------------------------------------- #
#                      Setup & Maintenance                      #
# ------------------------------------------------------------- #

[tasks.setup]
description = "Install git hooks via hk"
outputs = []
cache = { enabled = false }
run = "hk install --mise --quiet"

[tasks.clean]
description = "Clean Cargo artifacts and optional generated reports"
outputs = []
cache = { enabled = false }
confirm = "Clean Cargo artifacts and reports?"
usage = '''
flag "--dry-run" help="Show what would be deleted"
flag "--release" help="Clean release artifacts only"
flag "--doc" help="Clean generated docs only"
flag "--profile <profile>" help="Clean one Cargo profile"
flag "--target-dir <dir>" help="Cargo target directory" default="target"
flag "--reports" help="Remove generated coverage/mutation report files"
flag "--all" help="Clean entire Cargo target directory"
flag "--if-over-gib <gib>" {
  help "Only clean Cargo target if it exceeds this size in GiB"
}
flag "--sweep-days <days>" {
  help "Use cargo-sweep to remove target artifacts older than DAYS"
}
flag "--sweep-max-size <size>" {
  help "Use cargo-sweep to shrink target below SIZE, e.g. 10GiB"
}
'''
run = '''
#!/bin/bash
set -euo pipefail

source "${MISE_PROJECT_ROOT:?}/.mise/scripts/size_gate.sh"

readonly TARGET_DIR="${usage_target_dir?}"
clean_target=true
clean_reports=false

if [[ "${usage_reports:-false}" == "true" ]]; then
  clean_target=false
  clean_reports=true
fi

if [[ "${usage_all:-false}" == "true" ]]; then
  clean_target=true
fi

if [[ -n "${usage_if_over_gib:-}" && -d "${TARGET_DIR}" ]]; then
  require_nonneg_int clean --if-over-gib "${usage_if_over_gib}"
  TARGET_KIB="$(dir_size_kib "${TARGET_DIR}")"
  readonly TARGET_KIB
  readonly LIMIT_KIB="$(gib_to_kib "${usage_if_over_gib}")"

  if (( TARGET_KIB <= LIMIT_KIB )); then
    TARGET_GIB="$(awk "BEGIN { print ${TARGET_KIB} / 1024 / 1024 }")"
    readonly TARGET_GIB
    printf 'target is %.1f GiB; below %s GiB, skipping target clean\n' \
      "${TARGET_GIB}" "${usage_if_over_gib}"
    clean_target=false
  fi
fi

if [[ "${clean_target}" == "true" ]]; then
  if [[ -n "${usage_sweep_days:-}" || -n "${usage_sweep_max_size:-}" ]]; then
    if [[ "${TARGET_DIR}" != "target" ]]; then
      printf '%s\n' "--target-dir is not supported with cargo-sweep mode" >&2
      exit 2
    fi

    # cargo-sweep flags live in one place: the sweep task. The size gate above
    # (when given) has already run, matching pre-delegation behavior.
    declare -a sweep_task=(mise run sweep)
    [[ "${usage_dry_run:-false}" == "true" ]] && sweep_task+=(--dry-run)
    [[ -n "${usage_sweep_days:-}" ]] \
      && sweep_task+=(--days "${usage_sweep_days}")
    [[ -n "${usage_sweep_max_size:-}" ]] \
      && sweep_task+=(--max-size "${usage_sweep_max_size}")
    "${sweep_task[@]}"
  else
    declare -a cargo_args=(clean --target-dir "${TARGET_DIR}")
    [[ "${usage_dry_run:-false}" == "true" ]] && cargo_args+=(--dry-run)
    [[ "${usage_release:-false}" == "true" ]] && cargo_args+=(--release)
    [[ "${usage_doc:-false}" == "true" ]] && cargo_args+=(--doc)
    [[ -n "${usage_profile:-}" ]] && cargo_args+=(--profile "${usage_profile}")
    cargo "${cargo_args[@]}"
  fi
fi

if [[ "${clean_reports}" == "true" ]]; then
  readonly -a reports=(
    lcov.info
    tarpaulin-report.html
    mutants.out
    mutants.out.old
    mutants-report.md
  )
  if [[ "${usage_dry_run:-false}" == "true" ]]; then
    printf 'would remove generated reports: %s\n' "${reports[*]}"
  else
    rm -rf "${reports[@]}"
  fi
fi
'''

# bash-only by design (no run_windows): macOS dev + Linux CI only.
[tasks.sweep]
description = "Reclaim Cargo target space: prune stale incremental sessions (default, gated by --max-gib) or run cargo-sweep by age/size (--days/--max-size)"
outputs = []
cache = { enabled = false }
usage = '''
flag "--max-gib <gib>" help="Incremental-prune mode: only prune when target exceeds this size in GiB (non-negative integer)" default="10"
flag "--days <days>" help="cargo-sweep mode: remove target artifacts older than DAYS"
flag "--max-size <size>" help="cargo-sweep mode: shrink target below SIZE (e.g. 10GB)"
flag "--dry-run" help="Show what would be removed without removing it"
'''
run = '''
#!/bin/bash
# shellcheck disable=SC2154  # usage_* are injected by mise
set -euo pipefail

source "${MISE_PROJECT_ROOT:?}/.mise/scripts/size_gate.sh"

# Fail fast with a clear message when run outside mise's usage injection.
: "${usage_max_gib?}"
require_nonneg_int sweep --max-gib "${usage_max_gib}"

# The tree whose size gates the sweep is the tree whose incrementals get pruned;
# TARGET_DIR is the single source of that coupling.
readonly TARGET_DIR="${CARGO_TARGET_DIR:-target}"
readonly INCREMENTAL_DIR="${TARGET_DIR}/debug/incremental"
readonly LIMIT_KIB="$(gib_to_kib "${usage_max_gib}")"

# cargo-sweep mode: an explicit age/size request runs cargo-sweep directly and
# is not gated by --max-gib (reclamation was asked for by name).
run_cargo_sweep() {
  declare -a args=()
  [[ "${usage_dry_run:-false}" == "true" ]] && args+=(--dry-run)
  [[ -n "${usage_days:-}" ]] && args+=(--time "${usage_days}")
  [[ -n "${usage_max_size:-}" ]] && args+=(--maxsize "${usage_max_size}")
  cargo sweep "${args[@]}"
}

main() {
  if [[ -n "${usage_days:-}" || -n "${usage_max_size:-}" ]]; then
    run_cargo_sweep
    return 0
  fi

  # count replaces the bash array-length expansion: mise renders TOML
  # run bodies as Tera, which would parse that form as a comment
  # opener (docs/refs/mise_tasks/04_toml_tasks.md).
  local size_kib newest="" count=0
  local -a stale=()

  if [[ ! -d "${TARGET_DIR}" ]]; then
    echo "sweep: no target directory, skipping"
    return 0
  fi

  size_kib="$(dir_size_kib "${TARGET_DIR}")"
  if (( size_kib <= LIMIT_KIB )); then
    echo "sweep: target under threshold, skipping"
    return 0
  fi

  local dir
  for dir in "${INCREMENTAL_DIR}"/*/; do
    [[ -d "${dir}" ]] || continue
    # -nt sees directory mtimes, which update on direct-child
    # create/delete; equal mtimes keep the lexicographically first.
    if [[ -z "${newest}" || "${dir}" -nt "${newest}" ]]; then
      if [[ -n "${newest}" ]]; then
        stale+=("${newest}")
        count=$(( count + 1 ))
      fi
      newest="${dir}"
    else
      stale+=("${dir}")
      count=$(( count + 1 ))
    fi
  done

  if (( count == 0 )); then
    echo "sweep: no stale incremental sessions found"
    return 0
  fi

  if [[ "${usage_dry_run:-false}" == "true" ]]; then
    printf 'sweep: would remove %d stale incremental session(s):\n' "${count}"
    printf '  %s\n' "${stale[@]}"
    return 0
  fi

  rm -rf "${stale[@]}"
  echo "sweep: removed stale incremental sessions"
}

main
'''

# ------------------------------------------------------------- #
#                   Development & Compilation                   #
# ------------------------------------------------------------- #

[tasks.check]
description = "Fast compile check, then hk project checks"
alias = "c"
outputs = []
cache = { enabled = false }
usage = '''
arg "[args]" var=#true help="Extra arguments forwarded to cargo check (hk check never receives them)"
'''
run = '''
#!/bin/bash
# extra (below) is populated via eval from mise's usage_args
# (var=#true arg); see docs/refs/mise_tasks/06_arguments.md.
# shellcheck disable=SC2154
set -euo pipefail

declare -a extra
eval "extra=(${usage_args:-})"

cargo check --workspace "${extra[@]+"${extra[@]}"}"
hk check
'''

[tasks.build]
description = "Debug build"
alias = "b"
sources = ["@group:rust"]
outputs = ["target/debug/traces-pkm"]
usage = 'arg "[args]" var=#true help="Extra arguments forwarded to cargo build"'
run = '''
#!/bin/bash
# extra is populated via eval from mise's usage_args (var=#true arg).
# shellcheck disable=SC2154
set -euo pipefail
declare -a extra
eval "extra=(${usage_args:-})"
cargo build "${extra[@]+"${extra[@]}"}"
'''

[tasks.watch]
description = "Watch Cargo check/test on changes"
outputs = []
cache = { enabled = false }
run = "cargo watch -x check -x test"

# ------------------------------------------------------------- #
#                     Formatting & Linting                      #
# ------------------------------------------------------------- #

[tasks.fmt]
description = "Format all Rust code (nightly)"
alias = "f"
outputs = []
cache = { enabled = false }
usage = 'flag "--check" help="Check formatting without modifying files"'
run = '''
#!/bin/bash
set -euo pipefail

declare -a args=(--all)
[[ "${usage_check:-false}" == "true" ]] && args+=(-- --check)
cargo fmt "${args[@]}"
'''

[tasks.lint]
description = "Strict clippy: workspace, all targets, all features. Auto-fixes 18 common lints unless --no-fix."
alias = "l"
depends = ["fmt"]
sources = ["@group:rust"]
outputs = []
cache = { enabled = false }
usage = '''
flag "--fix" negate="--no-fix" default=#true help="Auto-fix known lints"
flag "--deny-warnings" negate="--no-deny-warnings" default=#true {
  help "Treat Clippy warnings as errors"
}
flag "--fix-lints <lints>" env="CLIPPY_FIX_LINTS" {
  help "Override fix lint list (comma-separated)"
}
'''
run = '''
#!/bin/bash
set -euo pipefail

declare -a cargo_args=(--workspace --all-targets --all-features)
declare -a clippy_args=()

readonly -a default_fix_lints=(
  as_pointer_underscore
  as_underscore
  bool_assert_comparison
  dbg_macro
  manual_let_else
  needless_borrow
  needless_collect
  or_fun_call
  redundant_clone
  redundant_closure_for_method_calls
  redundant_field_names
  search_is_some
  significant_drop_in_scrutinee
  str_to_string
  trait_duplication_in_bounds
  uninlined_format_args
  use_self
  useless_conversion
)

if [[ "${usage_deny_warnings?}" == "true" ]]; then
  clippy_args+=(-D warnings)
fi

if [[ "${usage_fix?}" == "true" ]]; then
  cargo_args+=(--fix --allow-dirty --allow-staged)

  declare -a fix_lints=("${default_fix_lints[@]}")
  if [[ -n "${usage_fix_lints:-}" ]]; then
    _old_ifs="${IFS}"
    IFS=',' read -ra fix_lints <<< "${usage_fix_lints}"
    IFS="${_old_ifs}"
  fi

  for lint in "${fix_lints[@]}"; do
    [[ -n "${lint}" ]] && clippy_args+=(-W "clippy::${lint}")
  done
fi

cargo clippy "${cargo_args[@]}" -- "${clippy_args[@]}"
'''

[tasks.audit]
description = "Run cargo deny audit"
outputs = []
usage = 'arg "[args]" var=#true help="Extra arguments forwarded to cargo deny check"'
run = '''
#!/bin/bash
# extra is populated via eval from mise's usage_args (var=#true arg).
# shellcheck disable=SC2154
set -euo pipefail
declare -a extra
eval "extra=(${usage_args:-})"
cargo deny check "${extra[@]+"${extra[@]}"}"
'''

# ------------------------------------------------------------- #
#                    Testing & Benchmarking                     #
# ------------------------------------------------------------- #

[tasks.test]
description = "Run tests with nextest (+ doc-tests by default)"
alias = "t"
sources = ["@group:rust"]
outputs = []
cache = { enabled = false }
usage = '''
flag "--feature <feature>" help="Enable a specific feature" default="all"
flag "--docs" negate="--no-docs" default=#true {
  help "Also run doc-tests via cargo test after nextest"
}
flag "-m --mod <module>" {
  help "Run tests for a specific module only"
  choices "cli" "config" "dialog" "index" "note" "query" "schema" "template"
}
arg "[args]" var=#true {
  help "Filter expression forwarded to cargo nextest run"
  long_help """
  Forwarded to `cargo nextest run`. Examples:

    mise run test index::query          # substring match
    mise run test --test init_cli       # by binary
    mise run test --lib                 # by target
    mise run test -E 'test(/^index::/)' # nextest expression
  """
}
'''
run = '''
#!/bin/bash
# nextest_extra (below) is populated via eval from mise's usage_args
# (var=#true arg); see docs/refs/mise_tasks/06_arguments.md.
# shellcheck disable=SC2154
set -euo pipefail

declare -a nextest_args
declare -a cargo_test_args

if [[ "${usage_feature?}" == "all" ]]; then
  nextest_args=(-p traces-pkm --all-features)
  cargo_test_args=(--workspace --all-features)
else
  nextest_args=(-p traces-pkm --features "${usage_feature?}")
  cargo_test_args=(--workspace --features "${usage_feature?}")
fi

if [[ -n "${usage_mod:-}" ]]; then
  nextest_args+=(-E "test(/^${usage_mod}::/)")
  if [[ "${usage_feature?}" == "all" ]]; then
    cargo_test_args=(-p traces-pkm --all-features)
  else
    cargo_test_args=(-p traces-pkm --features "${usage_feature?}")
  fi
fi

eval "nextest_extra=(${usage_args:-})"
nextest_args+=("${nextest_extra[@]+"${nextest_extra[@]}"}")

cargo nextest run "${nextest_args[@]}"

if [[ "${usage_docs?}" == "true" ]]; then
  cargo test "${cargo_test_args[@]}" --doc -- --quiet
fi
'''

[tasks.bench]
description = "Run Criterion benchmarks"
sources = ["@group:bench"]
# Measurement gate: must run on invocation. Criterion output is
# non-deterministic and baselines must never be skipped as "fresh"
# (policy: mise.toml task_config.cache rationale; mirrors [tasks.test]).
outputs = []
cache = { enabled = false }
# Raw criterion output: verbose statistical tables are unreadable when
# every line is prefixed `bench: …` (07_configuration.md:1199-1208).
output = "interleave"
depends_post = ["bench:report"]
timeout = "20m"
usage = '''
flag "-f --files <pattern>" {
  help "Select bench targets (benches/*.rs) by file-name substring"
  long_help """
  Matches bench target file names under benches/*.rs by substring; different from criterion's own benchmark-name filter, which runs at test time and is forwarded via [args] after --.
  """
}
flag "-m --mod <module>" {
  help "Run benchmarks for a specific module"
  choices "hash" "index" "note" "query" "template" "memory_footprint"
}
flag "-r --report [name]" value_optional=#true {
  help "Save a named baseline (default: auto-named from git branch+sha)"
  long_help """
  Bare -r auto-names the baseline `<branch>-<short-sha>[-dirty][-quick]`: rerunning on the *same* commit overwrites one bounded baseline dir, while a new commit/branch gets its own comparable checkpoint. Pass a value for an explicit, memorable name instead, e.g. for a long-lived comparison point:

    mise run bench -r position-refactor

  Skipped automatically when [args] already forwards --baseline, --baseline-lenient, --discard-baseline, or --load-baseline, since criterion rejects combining those with --save-baseline. Use --no-report to opt out entirely and fall back to criterion's own unnamed 'base'.
  """
}
flag "--no-report" {
  help "Skip the named baseline; fall back to criterion's unnamed 'base'"
}
flag "--compare <name>" help="Compare against a saved baseline via critcmp"
flag "--model" {
  help "Fit performance models (linear, n·ln(n), combined) per series after benchmarking"
}
flag "-q --quick" {
  help "Fast iteration: 10 samples, 1s measurement, 1s warm-up, noplot"
}
flag "-t --test" {
  help "Smoke-test benchmarks: run each once without measurement"
}
arg "[args]" var=#true {
  help "Extra arguments forwarded to cargo bench (to bench:model with --model)"
  long_help """
  Forwarded to `cargo bench`. Examples:

    mise run bench -- --list               # list available benchmarks
    mise run bench -f note_parsing -- fast  # narrow, then criterion's filter
    mise run bench -m index -- --warm-up 1 # custom warm-up time
    mise run bench -- --noplot             # skip HTML report generation

  With --model, forwarded to bench:model instead of cargo bench:

    mise run bench --model -- --plot       # fitted curves in the terminal
  """
}
'''
run = '''
#!/bin/bash
# extra_args (below) is populated via eval from mise's usage_args
# (var=#true arg); see docs/refs/mise_tasks/06_arguments.md.
# shellcheck disable=SC2154
set -euo pipefail

declare -a bench_args=(bench --features test-utils)
declare -a criterion_args=()
has_criterion_args=false

# --- Resolve bench files ---
declare -a bench_files=()
if [[ -n "${usage_mod:-}" ]]; then
  case "${usage_mod}" in
    hash)     bench_files=(hash) ;;
    index)    bench_files=(index_codec index_inlinks index_build index_refresh index_store) ;;
    note)     bench_files=(note_parsing) ;;
    query)    bench_files=(query_execution query_parsing query_sort) ;;
    template) bench_files=(template_render) ;;
    memory_footprint) bench_files=(memory_footprint) ;;
  esac
elif [[ -n "${usage_files:-}" ]]; then
  for f in benches/*.rs; do
    bf="${f##*/}"
    bf="${bf%.rs}"
    [[ "${bf}" == *"${usage_files}"* ]] && bench_files+=("${bf}")
  done
else
  for f in benches/*.rs; do
    bf="${f##*/}"
    bench_files+=("${bf%.rs}")
  done
fi

if [[ -z "${bench_files[*]:-}" ]]; then
  printf 'no benchmark files match\n' >&2
  exit 2
fi

# --- Execution mode defaults ---
if [[ "${usage_test:-false}" == "true" ]]; then
  criterion_args+=(--test)
  has_criterion_args=true
elif [[ "${usage_quick:-false}" == "true" ]]; then
  # Quick mode: ultra-fast iteration for local development loops (~60s full, ~25s module)
  criterion_args+=(
    --sample-size 10 --measurement-time 0.5 --warm-up-time 0.2 --noplot
  )
  has_criterion_args=true
else
  # Normal mode: fast, responsive developer defaults (~3-4m full) instead of Criterion's 8s/bench
  criterion_args+=(
    --sample-size 20 --measurement-time 1.0 --warm-up-time 0.5
  )
  has_criterion_args=true
fi

# --- Extra args ---
# extra_args is populated by eval below; mise pre-quotes each usage_args
# token specifically for this reconstruction (see docs/refs/mise_tasks/
# 06_arguments.md), so shellcheck can't trace the assignment, but the
# input isn't attacker-controlled free text.
eval "extra_args=(${usage_args:-})"
# Model mode: forwarded args belong to bench:model (bench --model -- --plot);
# criterion rejects unknown flags such as --plot.
if [[ "${usage_model:-false}" != "true" ]]; then
  criterion_args+=("${extra_args[@]+"${extra_args[@]}"}")
  [[ -n "${usage_args:-}" ]] && has_criterion_args=true
fi

# --- Baseline management ---
# Outputs a baseline name to save, or empty if no baseline should be
# saved.  Skips when: --no-report is set, or the user forwarded
# --baseline/--baseline-lenient/--discard-baseline/--load-baseline
# (criterion rejects combining those with --save-baseline).
resolve_baseline_name() {
  if [[ "${usage_no_report:-false}" == "true" || "${usage_test:-false}" == "true" ]]; then
    return
  fi

  for a in "${extra_args[@]+"${extra_args[@]}"}"; do
    case "${a}" in
      --baseline | --baseline-lenient | \
      --discard-baseline | --load-baseline)
        return
        ;;
    esac
  done

  # Explicit name via -r <name>
  if [[ -n "${usage_report:-}" \
    && "${usage_report}" != "true" ]]; then
    printf '%s' "${usage_report}"
    return
  fi

  # Auto-name from git state: branch-sha[-dirty][-quick]
  if branch="$(git rev-parse --abbrev-ref HEAD 2>/dev/null)"; then
    branch="${branch//\//-}"
    [[ "${branch}" == "HEAD" ]] && branch="detached"
    sha="$(git rev-parse --short HEAD)"
    dirty=""
    git diff --quiet HEAD || dirty="-dirty"
    printf '%s' "${branch}-${sha}${dirty}"
  else
    printf '%s' "$(date +%Y%m%d-%H%M%S)"
  fi
}

baseline="$(resolve_baseline_name)"
if [[ -n "${baseline}" ]]; then
  [[ "${usage_quick:-false}" == "true" ]] && baseline+="-quick"
  criterion_args+=(--save-baseline "${baseline}")
  has_criterion_args=true
fi

# --- Phase 1: Compile all selected bench targets in a single parallel pass ---
declare -a compile_targets=()
total_targets=0
for bf in "${bench_files[@]}"; do
  compile_targets+=(--bench "${bf}")
  total_targets=$((total_targets + 1))
done
printf '==> Compiling %d benchmark target(s)...\n' "${total_targets}"
cargo bench --no-run --features test-utils "${compile_targets[@]}"

# --- Phase 2: Execute each benchmark binary in an isolated loop ---
declare -a failed_targets=()
current_idx=0

for bf in "${bench_files[@]}"; do
  current_idx=$((current_idx + 1))
  printf '\n[%d/%d] Running benchmark target: %s\n' "${current_idx}" "${total_targets}" "${bf}"
  declare -a run_cmd=(cargo bench --bench "${bf}" --features test-utils)
  if [[ "${has_criterion_args}" == "true" ]]; then
    run_cmd+=(-- "${criterion_args[@]+"${criterion_args[@]}"}")
  fi
  if ! "${run_cmd[@]}"; then
    printf 'Error: Benchmark target %s failed\n' "${bf}" >&2
    failed_targets+=("${bf}")
  fi
done

if [[ -n "${failed_targets[*]:-}" ]]; then
  printf '\nBenchmark run failed. Failed targets: %s\n' "${failed_targets[*]}" >&2
  exit 1
fi
# --- Compare ---
if [[ -n "${usage_compare:-}" ]]; then
  critcmp "${usage_compare}"
fi

# --- Model ---
# --force: the model must run after benchmarking even when its script is
# unchanged; the outer --force does not propagate to this nested mise run.
if [[ "${usage_model:-false}" == "true" ]]; then
  if [[ -n "${usage_args:-}" ]]; then
    mise run --force bench:model -- "${extra_args[@]}"
  else
    mise run --force bench:model -- --summary
  fi
fi
'''

# ------------------------------------------------------------- #
#                 Quality, Coverage & Mutation                  #
# ------------------------------------------------------------- #

[tasks.coverage]
description = "Code coverage with tarpaulin (outputs tarpaulin-report.html)"
sources = ["@group:rust", "tarpaulin.toml"]
outputs = ["tarpaulin-report.html"]
usage = '''
flag "-m --mod <module>" {
  help "Run coverage for a specific module only"
  choices "cli" "config" "dialog" "index" "note" "query" "schema" "template"
}
'''
run = '''
#!/bin/bash
set -euo pipefail

declare -a args=(--workspace --out html)
if [[ -n "${usage_mod:-}" ]]; then
  args=(--include "src/${usage_mod}/**" --out html)
fi
cargo tarpaulin "${args[@]}"
'''

[tasks.crap]
description = "Run Change Risk Anti-Patterns (CRAP) analysis"
sources = ["@group:rust", "tarpaulin.toml"]
outputs = ["lcov.info"]
run = ["cargo tarpaulin --workspace", "cargo crap --lcov lcov.info"]

[tasks.mutants]
description = "Run parallel mutation testing with cargo-mutants"
sources = ["@group:rust"]
outputs = []
depends = ["test"]
timeout = "1h"
usage = '''
flag "-f --file <file>" help="Run mutants in a specific file only"
flag "-m --mod <module>" {
  help "Run mutants in a specific module only"
  choices "cli" "config" "dialog" "index" "note" "query" "schema" "template"
}
flag "--check" {
  help "Build-only: check mutants compile without running tests"
}
flag "-L --level <level>" {
  help "Log verbosity"
  choices "trace" "debug" "info" "warn" "error"
}
flag "--exclude <glob>" help="Exclude files matching glob"
flag "--timeout <secs>" help="Override test timeout in seconds"
flag "-v --caught" { help "Also print mutants caught by tests" }
flag "-V --unviable" { help "Also print mutants that failed to build" }
flag "--all-logs" { help "Print all Cargo output to stdout" }
flag "--json" { help "Emit machine-readable output" }
flag "--no-config" { help "Ignore .cargo/mutants.toml" }
flag "--iterate" negate="--no-iterate" default=#true {
  help "Skip mutants caught in previous runs"
}
arg "[args]" var=#true {
  help "Extra arguments forwarded to cargo mutants"
  long_help """
  Forwarded to `cargo mutants`. Examples:

    mise run mutants -- --list               # list available mutants
    mise run mutants -m index -- --list      # narrow, then list
  """
}
'''
run = '''
#!/bin/bash
# shellcheck disable=SC2154
set -euo pipefail

declare -a args=(
  --baseline run
  --cap-lints true
  --build-timeout-multiplier 3
  --profile mutants
)

# Scope
[[ "${usage_iterate:-true}" == "true" ]]    && args+=(--iterate)
[[ -n "${usage_file:-}" ]]                  && args+=(--file "${usage_file}")
[[ -n "${usage_mod:-}" ]]                   && args+=(--file "src/${usage_mod}/**/*.rs")
[[ "${usage_check:-false}" == "true" ]]     && args+=(--check)
[[ -n "${usage_level:-}" ]]                 && args+=(--level "${usage_level}")
[[ -n "${usage_exclude:-}" ]]               && args+=(--exclude "${usage_exclude}")
[[ -n "${usage_timeout:-}" ]]               && args+=(--timeout "${usage_timeout}")
[[ "${usage_caught:-false}" == "true" ]]    && args+=(--caught)
[[ "${usage_unviable:-false}" == "true" ]]  && args+=(--unviable)
[[ "${usage_all_logs:-false}" == "true" ]]  && args+=(--all-logs)
[[ "${usage_json:-false}" == "true" ]]      && args+=(--json)
[[ "${usage_no_config:-false}" == "true" ]] && args+=(--no-config)

# Passthrough
eval "args+=(${usage_args:-})"

cargo mutants "${args[@]}"
'''
depends_post = ["mutants:report"]

# ------------------------------------------------------------- #
#                    Release & Verification                     #
# ------------------------------------------------------------- #

[tasks.release]
description = "Release build"
alias = "r"
sources = ["@group:rust"]
outputs = ["target/release/traces-pkm"]
usage = 'arg "[args]" var=#true help="Extra arguments forwarded to cargo build --release"'
run = '''
#!/bin/bash
# extra is populated via eval from mise's usage_args (var=#true arg).
# shellcheck disable=SC2154
set -euo pipefail
declare -a extra
eval "extra=(${usage_args:-})"
cargo build --release "${extra[@]+"${extra[@]}"}"
'''

[tasks.doc]
description = "Build documentation (warnings as errors)"
env = { RUSTDOCFLAGS = "-D warnings" }
sources = ["@group:rust"]
outputs = ["target/doc"]
usage = 'arg "[args]" var=#true help="Extra arguments forwarded to cargo doc --no-deps"'
run = '''
#!/bin/bash
# extra is populated via eval from mise's usage_args (var=#true arg).
# shellcheck disable=SC2154
set -euo pipefail
declare -a extra
eval "extra=(${usage_args:-})"
cargo doc --no-deps "${extra[@]+"${extra[@]}"}"
'''

[tasks.verify]
description = "Full verification gate: fmt first, then check/lint/tests in parallel"
alias = "v"
cache = { enabled = false }
run = [
  # fmt mutates .rs files: it must finish before the readers start
  # (depends gives completion, not order — it cannot express this).
  { task = "fmt" },
  { tasks = ["check", "lint", "test"] },
]

# ------------------------------------------------------------- #
#                        Lifecycle Hooks                        #
# ------------------------------------------------------------- #

[hooks]
postinstall = '[ "${CI:-false}" = "true" ] || hk install --mise --quiet'
