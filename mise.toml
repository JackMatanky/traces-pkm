# -----------------------------------------------------------------------------
# Filename:    traces-pkm/mise.toml
# Docs:        https://mise.jdx.dev/
# Description: Project-wide tool versioning and task orchestration
# -----------------------------------------------------------------------------

[tools]
# -- Toolchain --
rust = { version = "nightly-2026-10-01", profile = "minimal", components = [
  "clippy",
  "rustfmt",
  "llvm-tools",
] }
# Keep every `install_env.RUSTUP_TOOLCHAIN` below and rust-toolchain.toml in
# sync with this version. Do NOT sync opencode.json's `RUST_DOCS_MCP_TOOLCHAIN`
# — rust-docs-mcp doc-gen needs its own toolchain (rustc >= 1.98 AND rustdoc
# JSON format 57, currently nightly-2026-06-10).
hk = "2.0.0"
cargo-binstall = "latest"

# -- Data Formats --
taplo = "latest"
tombi = "latest"
"cargo:ryl" = { version = "latest", install_env = { RUSTUP_TOOLCHAIN = "nightly-2026-10-01" } }

# -- Security --
gitleaks = "latest"
cargo-deny = "latest"
"cargo:cargo-audit" = "latest"

# -- Testing & Quality --
"github:nextest-rs/nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-crap" = "latest"
"cargo:https://github.com/quality-gates/messrust" = { version = "tag:v0.1.15" }
"cargo:mutarust" = "0.1.10"
"cargo:cargo-shear" = "latest"

# -- Benchmarking --
# Top-level `[tools]` keeps `critcmp` on `PATH` for `bench --compare` tab-completion.
"cargo:critcmp" = "latest"

# -- Dev Experience --
"cargo:cargo-watch" = "latest"
"cargo:cargo-sweep" = "latest"
"cargo:cargo-modules" = { version = "latest", install_env = { RUSTUP_TOOLCHAIN = "nightly-2026-10-01" } }

# -- Docs & ADRs --
"cargo:https://github.com/snowmead/rust-docs-mcp" = { version = "branch:main", crate = "rust-docs-mcp" }
"cargo:adrs" = { version = "latest", install_env = { RUSTUP_TOOLCHAIN = "nightly-2026-10-01" } }
"cargo:cargo-public-api" = "latest"

[settings]
# `lockfile` pins resolved tool versions into `mise.lock` so installs are
# reproducible across machines and `CI`.
lockfile = true
task.disable_spec_from_run_scripts = true
experimental = true

[env]
HK_MISE = "1"
ADR_DIRECTORY = "docs/adr/"
# Coverage filename-exclusion regex, consumed by `coverage:lcov`/`coverage:html`
# as cargo-llvm-cov's --ignore-filename-regex. Ported from the deleted
# tarpaulin.toml exclude-files; keep in sync with .cargo/mutants.toml's
# exclude globs. POSIX ERE only: no lookahead, no (?:...), no \d \w \s —
# an invalid regex silently disables ALL exclusions (defaults included).
COVERAGE_IGNORE_REGEX = 'src/main\.rs$|src/cli($|/)|src/(.*/)?error\.rs$'

[task_config]
global_inputs = ["mise.toml", "Cargo.lock", "clippy.toml"]

[task_config.cache]
# Freshness cache default. Gates inherit `gate:never-skip`
# (`cache = false`, `outputs = []`).
enabled = true

[task_config.input_groups]
# Groups list only task-specific inputs; `global_inputs` above already adds
# `mise.toml`, `Cargo.lock`, and `clippy.toml` to every task.
rust = ["Cargo.toml", "src/**/*.rs", "tests/**/*.rs"]
bench = ["Cargo.toml", "src/**/*.rs", "benches/**/*.rs"]

# ------------------------------------------------------------- #
#                      Setup & Maintenance                      #
# ------------------------------------------------------------- #

[tasks.setup]
description = "Install git hooks via `hk`"
outputs = []
cache = { enabled = false }
run = "hk install --mise --quiet"

# ------------------------------------------------------------- #
#                   Development & Compilation                   #
# ------------------------------------------------------------- #

[tasks.check]
description = "Fast compile check, then `hk` project checks"
alias = "c"
extends = "gate:never-skip"
usage = 'arg "[args]" var=#true help="Extra arguments forwarded to `cargo check` (`hk check` never receives them)"'
run = '''
#!/bin/bash
# usage_args is shell-quoted (var=#true arg); eval parses it into the extra
# array.
# shellcheck disable=SC2154
set -euo pipefail

declare -a extra
eval "extra=(${usage_args:-})"

cargo check --workspace "${extra[@]+"${extra[@]}"}"
hk check \
  --skip-step cargo-clippy \
  --skip-step cargo-test \
  --skip-step cargo-doc \
  --skip-step cargo-deny
'''

[tasks.build]
description = "Debug build"
alias = "b"
sources = ["@group:rust"]
outputs = ["target/debug/traces-pkm"]
usage = 'arg "[args]" var=#true help="Extra arguments forwarded to `cargo build`"'
run = '''
#!/bin/bash
# extra is populated via eval from mise's usage_args (var=#true arg).
# shellcheck disable=SC2154
set -euo pipefail
declare -a extra
eval "extra=(${usage_args:-})"
cargo build "${extra[@]+"${extra[@]}"}"
'''

[tasks.watch]
description = "Watch `cargo check`/`cargo test` on changes"
outputs = []
cache = { enabled = false }
run = "cargo watch -x check -x test"

[tasks."modules:tree"]
description = "Print the crate's module tree (`cargo modules structure`)"
sources = ["@group:rust"]
outputs = []
cache = { enabled = false }
env = { NO_COLOR = "1" }
usage = '''
flag "-d --depth <n>" help="Max depth from the crate root (`--max-depth`)"
flag "-m --mod <module>" {
  help "Focus the tree on one top-level module (`--focus-on`)"
  long_help "Passes `--focus-on <module>`. Relative paths are auto-prefixed with `crate::` because cargo-modules 0.27 rejects unqualified paths: `-m index` and `-m index::codec` work as written; `crate::…`/`traces_pkm::…` paths pass through unchanged."
}
// `complete "module"` completes the value after `-m`/`--mod`, not the flag name.
complete "module" run="sed -nE 's/^(pub )?mod ([a-z_]+);$/\\2/p' src/lib.rs"
flag "--cfg-test" help="Analyze with #[cfg(test)] enabled"
arg "[args]" var=#true help="Extra arguments forwarded to `cargo modules structure` (e.g. `--sort-by kind`, `--no-fns`)"
'''
run = '''
#!/bin/bash
# usage_* vars are injected by mise from the `usage` spec above.
# shellcheck disable=SC2154
set -euo pipefail
# `--lib` is required: the package has both [lib] and [[bin]], and
# cargo-modules errors with "Multiple targets present in package" otherwise.
declare -a cmd=(cargo modules structure --lib)
[[ -n "${usage_depth:-}" ]] && cmd+=(--max-depth "${usage_depth}")
# cargo-modules 0.27 rejects any path that isn't crate-absolute:
# `-m index` -> `Error: no items found matching use tree "index"`.
# Qualify unless already absolute (`crate::` or the package name); a leading
# `::` is stripped because upstream's sanitizer never trims it (utils.rs:19).
pkg="$(sed -n 's/^name = "\(.*\)"$/\1/p' Cargo.toml | head -1 | tr '-' '_')"
focus="${usage_mod:-}"
if [[ -n "$focus" ]]; then
  focus="${focus#::}"
  case "$focus" in
    crate::*|"${pkg}"::*) ;;
    *) focus="crate::${focus}" ;;
  esac
fi
[[ -n "$focus" ]] && cmd+=(--focus-on "$focus")
[[ "${usage_cfg_test:-false}" == "true" ]] && cmd+=(--cfg-test)
declare -a extra=()
# usage_args is shell-quoted (var=#true arg); eval parses it into the extra array.
eval "extra=(${usage_args:-})"
cmd+=("${extra[@]+"${extra[@]}"}")
exec "${cmd[@]}"
'''

[tasks."modules:orphans"]
description = "Detect source files not wired into the module tree (`cargo modules orphans`); exits non-zero when orphans are found"
sources = ["@group:rust"]
outputs = []
cache = { enabled = false }
env = { NO_COLOR = "1" }
usage = '''
flag "--cfg-test" help="Analyze with #[cfg(test)] enabled"
arg "[args]" var=#true help="Extra arguments forwarded to `cargo modules orphans` (`--lib`/`--deny` are applied automatically — don't repeat them)"
'''
run = '''
#!/bin/bash
# usage_* vars are injected by mise from the `usage` spec above.
# shellcheck disable=SC2154
set -euo pipefail
# `--lib` required (same multi-target rule as modules:tree); `--deny` always on
# so this task doubles as a check: non-zero exit when orphans exist.
declare -a cmd=(cargo modules orphans --lib --deny)
[[ "${usage_cfg_test:-false}" == "true" ]] && cmd+=(--cfg-test)
declare -a extra=()
# usage_args is shell-quoted (var=#true arg); eval parses it into the extra array.
eval "extra=(${usage_args:-})"
cmd+=("${extra[@]+"${extra[@]}"}")
exec "${cmd[@]}"
'''

[tasks."modules:deps"]
description = "Print the module dependency graph as DOT (`cargo modules dependencies`)"
sources = ["@group:rust"]
outputs = []
cache = { enabled = false }
env = { NO_COLOR = "1" }
usage = '''
flag "-d --depth <n>" help="Max depth from the crate root (`--max-depth`)"
flag "-m --mod <module>" {
  help "Focus the graph on one module (`--focus-on`)"
  long_help "Passes `--focus-on <module>`. Relative paths are auto-prefixed with `crate::` (see modules:tree): `-m index` and `-m index::codec` work as written. Conflicts with `--acyclic`."
}
// `complete "module"` completes the value after `-m`/`--mod`, not the flag name.
complete "module" run="sed -nE 's/^(pub )?mod ([a-z_]+);$/\\2/p' src/lib.rs"
flag "--acyclic" {
  help "Run cargo-modules graph cycle check (conflicts with -m)"
  long_help """
  Runs cargo-modules' rust-analyzer graph-model cycle check and conflicts with `-m`. cargo-modules currently reports at least one struct/impl graph-model cycle in this crate, not a real traces-pkm code cycle; it is informational and MUST NOT be used as a gate.
  """
}
arg "[args]" var=#true {
  help "Extra arguments for `cargo modules dependencies` (`--lib` is already applied; do not repeat it)"
  long_help """
  `--lib` is already applied and must not be repeated. Forwards options such as `--no-externs`, `--no-uses`, and `--layout dot`.

  cargo-modules 0.27 panics if a consumer closes DOT stdout early (for example, `mise run modules:deps | head`). For previewing or inspection, capture first:
    mise run modules:deps > module-deps.dot
    head -5 module-deps.dot

  This does not apply to full consumers such as Graphviz.
  """
}
'''
run = '''
#!/bin/bash
# usage_* vars are injected by mise from the `usage` spec above.
# shellcheck disable=SC2154
set -euo pipefail
# `--lib` is required: the package has both [lib] and [[bin]] (same rule as
# modules:tree / modules:orphans).
declare -a cmd=(cargo modules dependencies --lib)
[[ -n "${usage_depth:-}" ]] && cmd+=(--max-depth "${usage_depth}")
# same focus qualification as modules:tree (see above)
pkg="$(sed -n 's/^name = "\(.*\)"$/\1/p' Cargo.toml | head -1 | tr '-' '_')"
focus="${usage_mod:-}"
if [[ -n "$focus" ]]; then
  focus="${focus#::}"
  case "$focus" in
    crate::*|"${pkg}"::*) ;;
    *) focus="crate::${focus}" ;;
  esac
fi
[[ -n "$focus" ]] && cmd+=(--focus-on "$focus")
[[ "${usage_acyclic:-false}" == "true" ]] && cmd+=(--acyclic)
declare -a extra=()
# usage_args is shell-quoted (var=#true arg); eval parses it into the extra array.
eval "extra=(${usage_args:-})"
cmd+=("${extra[@]+"${extra[@]}"}")
exec "${cmd[@]}"
'''

# ------------------------------------------------------------- #
#                     Formatting & Linting                      #
# ------------------------------------------------------------- #

[tasks.fmt]
description = "Format all Rust code (nightly)"
alias = "f"
extends = "gate:never-skip"
usage = 'flag "--check" help="Check formatting without modifying files"'
run = '''
#!/bin/bash
set -euo pipefail

declare -a args=(--all)
[[ "${usage_check:-false}" == "true" ]] && args+=(-- --check)
cargo fmt "${args[@]}"
'''

[tasks."audit:deny"]
description = "Run cargo-deny checks (licenses, bans, sources)"
extends = "gate:never-skip"
usage = 'arg "[args]" var=#true help="Extra arguments forwarded to cargo deny check"'
run = '''
#!/bin/bash
set -euo pipefail
declare -a extra
eval "extra=(${usage_args:-})"
cargo deny check "${extra[@]+"${extra[@]}"}"
'''

[tasks."audit:sec"]
description = "Run cargo-audit checks (RustSec advisory database)"
extends = "gate:never-skip"
usage = 'arg "[args]" var=#true help="Extra arguments forwarded to cargo audit"'
run = '''
#!/bin/bash
set -euo pipefail
declare -a extra
eval "extra=(${usage_args:-})"
cargo audit "${extra[@]+"${extra[@]}"}"
'''

[tasks."audit:shear"]
description = "Detect unused/misplaced dependencies (cargo-shear)"
extends = "gate:never-skip"
usage = 'arg "[args]" var=#true help="Extra arguments forwarded to cargo shear"'
run = '''
#!/bin/bash
set -euo pipefail
declare -a extra
eval "extra=(${usage_args:-})"
cargo shear "${extra[@]+"${extra[@]}"}"
'''

[tasks.audit]
description = "Run all audit checks (cargo-deny, cargo-audit, cargo-shear)"
extends = "gate:never-skip"
run = [{ tasks = ["audit:deny", "audit:sec", "audit:shear"] }]

# ------------------------------------------------------------- #
#                 Quality, Coverage & Mutation                  #
# ------------------------------------------------------------- #

[tasks."coverage:lcov"]
description = "Generate LCOV coverage report for CRAP analysis"
sources = ["@group:rust"]
outputs = ["lcov.info"]
# TOML single quotes are consumed by TOML; the task runs under `sh -c`, so the
# shell expands "$COVERAGE_IGNORE_REGEX". `--lcov` conflicts with `--html`, so
# this stays a separate run from coverage:html. Do NOT add --no-clean: stale
# *.profraw from prior runs would merge into the report.
run = 'cargo llvm-cov nextest --workspace --all-features --lcov --output-path lcov.info --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"'

[tasks."coverage:html"]
description = "Generate HTML coverage report"
sources = ["@group:rust"]
outputs = ["target/llvm-cov/html"]
usage = '''
flag "-m --mod <module>" {
  help "Run coverage for a specific module only"
  long_help """
  Scopes coverage to files under `src/<module>/**` (e.g. `-m index`);
  every other path under `src/` is excluded from the report.
  Globally ignored paths (see COVERAGE_IGNORE_REGEX) remain excluded.
  """
}
// `complete "module"` completes the value after `-m`/`--mod`, not the flag name.
complete "module" run="sed -nE 's/^(pub )?mod ([a-z_]+);$/\\2/p' src/lib.rs"
'''
run = '''
#!/bin/bash
# usage_* vars are injected by mise from the `usage` spec above.
# shellcheck disable=SC2154
set -euo pipefail

# Start from the shared static exclusions; cargo-llvm-cov appends its default
# ignores (rustc/registry/target/tests...) to whatever we pass here.
regex="${COVERAGE_IGNORE_REGEX:?}"

if [[ -n "${usage_mod:-}" ]]; then
  if [[ ! -d "src/${usage_mod}" ]]; then
    echo "coverage: unknown module: ${usage_mod}" >&2
    exit 2
  fi
  # Globally ignored modules (COVERAGE_IGNORE_REGEX) can never produce a
  # report — reject instead of silently emitting an empty one. grep -E shares
  # the POSIX ERE flavor of the llvm-cov regex.
  if printf 'src/%s\n' "${usage_mod}" | grep -Eq "${COVERAGE_IGNORE_REGEX}"; then
    echo "coverage: module is excluded from coverage by COVERAGE_IGNORE_REGEX: ${usage_mod}" >&2
    exit 2
  fi
  # llvm-cov has no include-file flag, so scope TO the module by excluding
  # every sibling directory under src/ plus all src-root .rs files.
  # POSIX ERE only: no lookahead — enumerate exclusions positively.
  declare -a exclude=()
  for entry in src/*; do
    [[ -d "${entry}" ]] || continue
    name="${entry#src/}"
    [[ "${name}" == "${usage_mod}" ]] && continue
    exclude+=("src/${name}"'($|/)')
  done
  exclude+=('src/[^/]+\.rs$')
  # exclude must stay non-empty: bash 3.2 + set -u rejects expanding "${exclude[*]}" on an empty array
  regex="$(IFS='|'; echo "${exclude[*]}")|${regex}"
fi

# `--html` writes to the default target/llvm-cov/html/ (rm -rf'd each run, so
# directory-output freshness settles). `--lcov` and `--html` conflict.
cargo llvm-cov nextest --workspace --all-features \
  --html \
  --ignore-filename-regex "${regex}"
'''

[tasks.coverage]
description = "Run code coverage (HTML report)"
depends = ["coverage:html"]

[tasks.crap]
description = "Run Change Risk Anti-Patterns (CRAP) analysis"
depends = ["coverage:lcov"]
# `.cargo-crap.toml` changes CRAP output (threshold/excludes) and must be a
# declared input for cache correctness; bare paths resolve from the repo root.
sources = ["@group:rust", ".cargo-crap.toml"]
outputs = ["lcov.info"]
run = "cargo crap --lcov lcov.info"

[tasks.mess]
description = "Static mess detection with `messrust` (advisory)"
extends = "gate:never-skip"
usage = """
arg "[args]" var=#true {
  help "Extra arguments forwarded to messrust (e.g. --strict, --only Rule, --reportfile f.json)"
  long_help \"""
  Advisory static analysis with messrust — manual, never wired into verify/hk/CI.

  Workflow:
  1. Run after big refactors or before opening a PR: `mise run mess`
  2. Exit 0 = clean; exit 2 = findings (the normal advisory signal); exit 1 = tool error
  3. To triage machine-readably: `mise run mess -- --reportfile /tmp/mess.json --ignore-violations-on-exit` (exit 0, report kept)
  4. Tune policy in `messrust.xml` (rule refs, thresholds like reportLevel); history in docs/refs/quality_gates_messrust.md (§7–§9)
  5. Act: fix, or record why a finding stays; re-run

  Flag cheatsheet (forwarded verbatim after `--`, full reference docs/refs/messrust/docs/usage.md):
  --only Rule, --enable/--disable ruleset, --exclude path, --strict,
  --reportfile FILE, --ignore-tests (task always passes it),
  --ignore-violations-on-exit / --ignore-errors-on-exit (scripting escapes),
  --minimumpriority/--maximumpriority N, --suffixes ext, --color, --verbose
  \"""
}
"""
run = '''
#!/bin/bash
# usage_args is shell-quoted (var=#true arg); mise documents eval-into-array
# as the pattern for variadic args — intentional despite Google style §6.6.
# shellcheck disable=SC2154
set -euo pipefail
declare -a extra
eval "extra=(${usage_args:-})"
messrust src text messrust.xml --ignore-tests "${extra[@]+"${extra[@]}"}"
'''

# ------------------------------------------------------------- #
#                    Release & Verification                     #
# ------------------------------------------------------------- #

[tasks.release]
description = "Release build"
alias = "r"
sources = ["@group:rust"]
outputs = ["target/release/traces-pkm"]
usage = 'arg "[args]" var=#true help="Extra arguments forwarded to `cargo build --release`"'
run = '''
#!/bin/bash
# extra is populated via eval from mise's usage_args (var=#true arg).
# shellcheck disable=SC2154
set -euo pipefail
declare -a extra
eval "extra=(${usage_args:-})"
cargo build --release "${extra[@]+"${extra[@]}"}"
'''

[tasks.doc]
description = "Build documentation (warnings as errors)"
env = { RUSTDOCFLAGS = "-D warnings" }
sources = ["@group:rust"]
outputs = ["target/doc"]
usage = 'arg "[args]" var=#true help="Extra arguments forwarded to `cargo doc --no-deps`"'
run = '''
#!/bin/bash
# extra is populated via eval from mise's usage_args (var=#true arg).
# shellcheck disable=SC2154
set -euo pipefail
declare -a extra
eval "extra=(${usage_args:-})"
cargo doc --no-deps "${extra[@]+"${extra[@]}"}"
'''

[tasks.verify]
description = "Full verification gate: `fmt` first, then `check`/`lint`/`test` in parallel"
alias = "v"
extends = "gate:never-skip"
# `fmt` rewrites `.rs` files, so it must finish before `check`/`lint`/`test`
# read them; depends guarantees completion, not order, so it cannot express
# this.
run = [
  { task = "fmt" },
  { tasks = ["check", "lint --no-fix", "test"] },
]

# A file task's #MISE header rejects timeout (mise warns about unknown fields
# and drops it), so bench's safety cap lives on [task_templates.bench], which
# the bench file task inherits via its #MISE extends="bench" line. All other
# metadata stays in the file task.
[task_templates.bench]
timeout = "20m"

[task_templates.mutants]
timeout = "1h"
outputs = []
cache = { enabled = false }

# Never-skip payload for gate tasks whose whole payload is this pair: cache off
# blocks artifact-cache replay; outputs = [] blocks the freshness skip and
# asserts that the task produces no artifacts. Members inherit via extends
# instead of repeating both lines. A file task accepts one extends target only
# (the array form is silently dropped in 2026.9.12), so bench cannot join: its
# single slot goes to [task_templates.bench], and bench declares both lines
# locally instead. clean/setup/watch carry the same pair locally but are not
# gates (destructive, install, interactive).
[task_templates."gate:never-skip"]
outputs = []
cache = { enabled = false }

# ------------------------------------------------------------- #
#                        Lifecycle Hooks                        #
# ------------------------------------------------------------- #

[hooks]
postinstall = '[ "${CI:-false}" = "true" ] || hk install --mise --quiet'
