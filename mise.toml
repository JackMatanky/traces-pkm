# -----------------------------------------------------------------------------
# Filename:    traces-pkm/mise.toml
# Docs:        https://mise.jdx.dev/
# Description: Project-wide tool versioning and task orchestration
# -----------------------------------------------------------------------------

[tools]
rust = { version = "nightly", profile = "default", components = [
  "rust-src",
  "rustfmt",
  "rust-analyzer",
] }
hk = "latest"
taplo = "latest"
gitleaks = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-tarpaulin" = "latest"
"cargo:cargo-watch" = "latest"
"cargo:cargo-crap" = "latest"
"cargo:cargo-mutants" = "latest"
"cargo:cargo-sweep" = "latest"
"cargo:critcmp" = "latest"
"cargo:https://github.com/snowmead/rust-docs-mcp" = { version = "branch:main", crate = "rust-docs-mcp" }
"cargo:adrs" = { version = "latest", install_env = { RUSTUP_TOOLCHAIN = "nightly" } }
"cargo:ryl" = { version = "latest", install_env = { RUSTUP_TOOLCHAIN = "nightly" } }

[settings]
# Pin resolved "latest" tool versions (hk, taplo, gitleaks, cargo:* subcommands)
# into mise.lock so installs are reproducible across machines and CI.
lockfile = true
task.disable_spec_from_run_scripts = true
experimental = true

[env]
HK_MISE = "1"
ADR_DIRECTORY = "docs/adr/"

[task_config]
global_inputs = ["mise.toml"]

[task_config.cache]
enabled = true

[task_config.input_groups]
rust = ["Cargo.toml", "Cargo.lock", "src/**/*.rs"]

# ------------------------------------------------------------- #
#                      Setup & Maintenance                      #
# ------------------------------------------------------------- #

[tasks.setup]
description = "Install git hooks via hk"
run = "hk install --mise"

[tasks.clean]
description = "Clean Cargo artifacts and optional generated reports"
confirm = "Clean Cargo artifacts and reports?"
usage = '''
flag "--dry-run" help="Show what would be deleted"
flag "--release" help="Clean release artifacts only"
flag "--doc" help="Clean generated docs only"
flag "--profile <profile>" help="Clean one Cargo profile"
flag "--target-dir <dir>" help="Cargo target directory" default="target"
flag "--reports" help="Remove generated coverage/mutation report files"
flag "--all" help="Clean Cargo target and generated reports"
flag "--if-over-gib <gib>" help="Only clean Cargo target if it exceeds this size in GiB"
flag "--sweep-days <days>" help="Use cargo-sweep to remove target artifacts older than DAYS"
flag "--sweep-max-size <size>" help="Use cargo-sweep to shrink target below SIZE, e.g. 10GiB"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

target_dir="${usage_target_dir?}"
clean_target=true
clean_reports=false

if [[ "${usage_reports:-false}" == "true" ]]; then
  clean_target=false
  clean_reports=true
fi

if [[ "${usage_all:-false}" == "true" ]]; then
  clean_target=true
  clean_reports=true
fi

if [[ -n "${usage_if_over_gib:-}" && -d "${target_dir}" ]]; then
  target_kib="$(du -sk "${target_dir}" | cut -f1)"
  limit_kib="$(( usage_if_over_gib * 1024 * 1024 ))"

  if (( target_kib <= limit_kib )); then
    printf 'target is %.1f GiB; below %s GiB, skipping target clean\n' \
      "$(awk "BEGIN { print ${target_kib} / 1024 / 1024 }")" \
      "${usage_if_over_gib}"
    clean_target=false
  fi
fi

if [[ "${clean_target}" == "true" ]]; then
  if [[ -n "${usage_sweep_days:-}" || -n "${usage_sweep_max_size:-}" ]]; then
    if [[ "${target_dir}" != "target" ]]; then
      echo "--target-dir is not supported with cargo-sweep mode" >&2
      exit 2
    fi

    sweep_args=()
    [[ "${usage_dry_run:-false}" == "true" ]] && sweep_args+=(--dry-run)
    [[ -n "${usage_sweep_days:-}" ]] && sweep_args+=(--time "${usage_sweep_days}")
    [[ -n "${usage_sweep_max_size:-}" ]] && sweep_args+=(--maxsize "${usage_sweep_max_size}")
    cargo sweep "${sweep_args[@]}"
  else
    cargo_args=(clean --target-dir "${target_dir}")
    [[ "${usage_dry_run:-false}" == "true" ]] && cargo_args+=(--dry-run)
    [[ "${usage_release:-false}" == "true" ]] && cargo_args+=(--release)
    [[ "${usage_doc:-false}" == "true" ]] && cargo_args+=(--doc)
    [[ -n "${usage_profile:-}" ]] && cargo_args+=(--profile "${usage_profile}")
    cargo "${cargo_args[@]}"
  fi
fi

if [[ "${clean_reports}" == "true" ]]; then
  reports=(lcov.info tarpaulin-report.html mutants.out mutants.out.old mutants-report.md)
  if [[ "${usage_dry_run:-false}" == "true" ]]; then
    printf 'would remove generated reports: %s\n' "${reports[*]}"
  else
    rm -rf "${reports[@]}"
  fi
fi
'''

# ------------------------------------------------------------- #
#                   Development & Compilation                   #
# ------------------------------------------------------------- #

[tasks.check]
raw_args = true
description = "Fast compile check, then hk project checks"
run = ["cargo check --workspace", "hk check"]
alias = "c"

[tasks.build]
raw_args = true
description = "Debug build"
run = "cargo build"
alias = "b"
sources = ["@group:rust"]
outputs = ["target/debug/traces-pkm"]
rust_cache = true

[tasks.watch]
description = "Watch Cargo check/test on changes"
run = "cargo watch -x check -x test"

# ------------------------------------------------------------- #
#                     Formatting & Linting                      #
# ------------------------------------------------------------- #

[tasks.fmt]
raw_args = true
description = "Format all Rust code (nightly)"
alias = "f"
run = "cargo fmt --all"

[tasks.fix]
raw_args = true
description = "Auto-fix hk formatting issues"
run = "hk fix"

[tasks.lint]
description = "Strict clippy: workspace, all targets, all features. Auto-fixes known lints unless --no-fix."
alias = "l"
depends = ["fmt"]
usage = '''
flag "--fix" negate="--no-fix" default=#true help="Auto-fix known lints"
flag "--deny-warnings" negate="--no-deny-warnings" default=#true help="Treat Clippy warnings as errors"
flag "--fix-lints <lints>" env="CLIPPY_FIX_LINTS" help="Override fix lint list (comma-separated)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

declare -a cargo_args=(--workspace --all-targets --all-features)
declare -a clippy_args=()
declare -a default_fix_lints=(
  redundant_clone
  needless_collect
  or_fun_call
  redundant_field_names
  significant_drop_in_scrutinee
  use_self
  bool_assert_comparison
  uninlined_format_args
  needless_borrow
  useless_conversion
  manual_let_else
  redundant_closure_for_method_calls
  as_pointer_underscore
  as_underscore
  dbg_macro
  search_is_some
  str_to_string
  trait_duplication_in_bounds
)
if [[ "${usage_deny_warnings?}" == "true" ]]; then
  clippy_args+=(-D warnings)
fi

if [[ "${usage_fix?}" == "true" ]]; then
  cargo_args+=(--fix --allow-dirty --allow-staged)

  declare -a fix_lints=("${default_fix_lints[@]}")
  if [[ -n "${usage_fix_lints:-}" ]]; then
    IFS=',' read -ra fix_lints <<< "${usage_fix_lints}"
  fi

  for lint in "${fix_lints[@]}"; do
    [[ -n "${lint}" ]] && clippy_args+=(-W "clippy::${lint}")
  done
fi

cargo clippy "${cargo_args[@]}" -- "${clippy_args[@]}"
'''

[tasks.audit]
raw_args = true
description = "Run cargo deny audit"
run = "cargo deny check"

# ------------------------------------------------------------- #
#                    Testing & Benchmarking                     #
# ------------------------------------------------------------- #

[tasks.test]
description = "Run tests with nextest"
usage = '''
flag "--all" {
  help "Run all tests including doc-tests with cargo test"
  long_help """
  Switches from nextest to `cargo test` with the `test-utils` feature,
  which exercises doc-tests and the gated re-export surface in
  tests/integration.rs and tests/e2e.rs.

  Use this after public API changes or when nextest skips a test.
  """
}
flag "--mod <module>" {
  help "Run tests for a specific module only"
  choices "cli" "config" "dialog" "index" "note" "query" "schema" "template"
}
arg "[args]" var=#true {
  help "Filter expression forwarded to cargo nextest run"
  long_help """
  Arguments are forwarded to `cargo nextest run`.

  Scope by name (substring match):
    mise run test index::query

  Scope by binary:
    mise run test --test init_cli

  Scope by crate target:
    mise run test --lib
    mise run test --bin traces-pkm

  Nextest expression filter (-E):
    mise run test -E 'test(/^index::/)'
    mise run test -E 'test(my_test) + test(another)'
  """
}
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ "${usage_all:-false}" == "true" ]]; then
  cargo test --workspace --features test-utils
else
  eval "args=(${usage_args:-})"
  if [[ -n "${usage_mod:-}" ]]; then
    cargo nextest run -E "test(/^${usage_mod}::/)" "${args[@]}"
  else
    cargo nextest run "${args[@]}"
  fi
fi
'''
alias = "t"

[tasks.test-all]
description = "Run all tests including doc-tests"
hide = true
run = "mise run test --all"

[tasks.bench]
raw_args = true
description = "Run Criterion benchmarks"
run = "cargo bench --features test-utils"

# ------------------------------------------------------------- #
#                 Quality, Coverage & Mutation                  #
# ------------------------------------------------------------- #

[tasks.coverage]
description = "Code coverage with tarpaulin"
usage = '''
flag "--mod <module>" {
  help "Run coverage for a specific module only"
  choices "cli" "config" "dialog" "index" "note" "query" "schema" "template"
}
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

args=(--workspace --out html)
if [[ -n "${usage_mod:-}" ]]; then
  args=(--include "src/${usage_mod}/**" --out html)
fi
cargo tarpaulin "${args[@]}"
'''
sources = ["@group:rust"]
outputs = ["tarpaulin-report.html"]

[tasks.crap]
description = "Run Change Risk Anti-Patterns (CRAP) analysis"
run = ["cargo tarpaulin --workspace", "cargo crap --lcov lcov.info"]
outputs = ["lcov.info"]
sources = ["@group:rust", "tarpaulin.toml"]

[tasks.mutants]
description = "Run parallel mutation testing with cargo-mutants"
usage = '''
flag "-j --jobs <jobs>" help="Number of cargo build/test jobs in parallel" default="4"
flag "-f --file <file>" help="Examine only mutants in this file"
flag "--iterate" help="Skip mutants that were caught in previous runs"
flag "--mod <module>" {
  help "Examine mutants in a specific module only"
  choices "cli" "config" "dialog" "index" "note" "query" "schema" "template"
}
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

declare -a args=()
if [[ -n "${usage_jobs:-}" ]]; then
  args+=(--jobs "${usage_jobs}")
fi
if [[ -n "${usage_file:-}" ]]; then
  args+=(--file "${usage_file}")
fi
if [[ "${usage_iterate:-false}" == "true" ]]; then
  args+=(--iterate)
fi
if [[ -n "${usage_mod:-}" ]]; then
  args+=(--file "src/${usage_mod}/")
fi

cargo mutants "${args[@]}"
'''
depends_post = ["mutants-report"]

[tasks.mutants-report]
description = "Generate a structured Markdown report from missed mutants"
usage = '''
flag "-i --input <input>" help="Path to missed.txt input file" default="mutants.out/missed.txt"
flag "-o --output <output>" help="Path to mutants-report.md output file" default="mutants-report.md"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

readonly missed_file="${usage_input:-mutants.out/missed.txt}"
readonly report_file="${usage_output:-mutants-report.md}"

if [[ ! -f "${missed_file}" ]] || [[ ! -s "${missed_file}" ]]; then
  cat <<EOF > "${report_file}"
# Mutation Testing Report
**Status:** Completed successfully. All mutants were caught! 🎉
**Next Action:** No action needed. Test suite coverage is robust.
EOF
  exit 0
fi

cat <<EOF > "${report_file}"
# Mutation Testing Report
**Status:** Completed. Surviving mutants detected.

## Instructions for Next Agent Session
1. Read the list of surviving mutants below.
2. For each mutant, examine the file and add targeted assertions/unit tests to catch it.
3. Verify your fixes by running: \`cargo mutants --file <path-to-file>\`.

## Surviving Mutants List
\`\`\`text
$(cat "${missed_file}")
\`\`\`
EOF
'''

# ------------------------------------------------------------- #
#                    Release & Verification                     #
# ------------------------------------------------------------- #

[tasks.release]
raw_args = true
description = "Release build"
run = "cargo build --release"
alias = "r"
sources = ["@group:rust"]
outputs = ["target/release/traces-pkm"]
rust_cache = true

[tasks.doc]
raw_args = true
description = "Build documentation (warnings as errors)"
run = "cargo doc --no-deps"
env = { RUSTDOCFLAGS = "-D warnings" }
sources = ["@group:rust"]
outputs = ["target/doc"]
rust_cache = true

[tasks.verify]
description = "Full verification gate: check, lint, all tests"
alias = "v"
depends = ["check", "lint", "test-all"]

# ------------------------------------------------------------- #
#                        Lifecycle Hooks                        #
# ------------------------------------------------------------- #

[hooks]
postinstall = "hk install --mise"
