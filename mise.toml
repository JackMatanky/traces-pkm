#                    Release & Verification                     #
# ------------------------------------------------------------- #

[tasks.release]
description = "Release build"
alias = "r"
sources = ["@group:rust"]
outputs = ["target/release/traces-pkm"]
usage = 'arg "[args]" var=#true help="Extra arguments forwarded to cargo build --release"'
run = '''
#!/bin/bash
# extra is populated via eval from mise's usage_args (var=#true arg).
# shellcheck disable=SC2154
set -euo pipefail
declare -a extra
eval "extra=(${usage_args:-})"
cargo build --release "${extra[@]+"${extra[@]}"}"
'''

[tasks.doc]
description = "Build documentation (warnings as errors)"
env = { RUSTDOCFLAGS = "-D warnings" }
sources = ["@group:rust"]
outputs = ["target/doc"]
usage = 'arg "[args]" var=#true help="Extra arguments forwarded to cargo doc --no-deps"'
run = '''
#!/bin/bash
# extra is populated via eval from mise's usage_args (var=#true arg).
# shellcheck disable=SC2154
set -euo pipefail
declare -a extra
eval "extra=(${usage_args:-})"
cargo doc --no-deps "${extra[@]+"${extra[@]}"}"
'''

[tasks.verify]
description = "Full verification gate: fmt first, then check/lint/tests in parallel"
alias = "v"
cache = { enabled = false }
run = [
  # fmt mutates .rs files: it must finish before the readers start
  # (depends gives completion, not order — it cannot express this).
  { task = "fmt" },
  { tasks = ["check", "lint", "test"] },
]

# File-task headers reject `timeout` (mise warns "unknown field(s)" and
# drops it), so the bench safety cap lives on a template the file task
# inherits via `#MISE extends="bench"`. Carries only timeout -- other
# metadata stays in the file task so --help remains byte-identical.
[task_templates.bench]
timeout = "20m"

# Never-skip payload: the complete local opt-out for tasks in the
# task_config.cache rationale above whose entire payload is exactly this pair
# (pair kept byte-identical to the pre-template local payloads; cache off
# alone forbids skip, outputs [] pins the no-artifacts contract).
# Members inherit via extends instead of repeating both lines locally.
# File tasks take a single extends target (array form silently drops in
# 2026.9.12) — bench-shaped gates cannot join without the local-payload dance.
# Exempt: bench (its file task spends its only extends on [task_templates.bench]);
# verify (resolves outputs {auto:true}, not []); clean/setup/watch (same
# payload, different policy class: destructive/install/interactive).
[task_templates."gate:never-skip"]
outputs = []
cache = { enabled = false }

# ------------------------------------------------------------- #
#                        Lifecycle Hooks                        #
# ------------------------------------------------------------- #

[hooks]
postinstall = '[ "${CI:-false}" = "true" ] || hk install --mise --quiet'
