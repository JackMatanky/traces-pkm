#:tombi schema.strict = false
# -----------------------------------------------------------------------------
# Filename:    traces-pkm/mise.toml
# Docs:        https://mise.jdx.dev/
# Description: Project-wide tool versioning and task orchestration
# -----------------------------------------------------------------------------

[tools]
rust = { version = "nightly", profile = "default", components = [
  "rust-src",
  "rustfmt",
  "rust-analyzer",
] }
hk = "latest"
taplo = "latest"
gitleaks = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-tarpaulin" = "latest"
"cargo:cargo-watch" = "latest"
"cargo:critcmp" = "latest"
"cargo:wasm-pack" = "latest"
"cargo:https://github.com/snowmead/rust-docs-mcp" = { version = "branch:main", crate = "rust-docs-mcp" }
"cargo:adrs" = { version = "latest", install_env = { RUSTUP_TOOLCHAIN = "nightly" } }
"cargo:ryl" = { version = "latest", install_env = { RUSTUP_TOOLCHAIN = "nightly" } }

[settings]
# Pin resolved "latest" tool versions (hk, taplo, gitleaks, cargo:* subcommands)
# into mise.lock so installs are reproducible across machines and CI.
lockfile = true

[env]
HK_MISE = "1"
ADR_DIRECTORY = "docs/adr/"

[tasks.build]
description = "Debug build"
run = "cargo build"
alias = "b"
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock"]
outputs = ["target/debug/traces-pkm"]

[tasks.check]
description = "Fast compilation check"
run = "cargo check --workspace"
alias = "c"

# Scoping: extra args pass straight through to nextest (no usage spec = unvalidated passthrough).
#   mise run test -- <name-substring>     filter by test/module path, e.g. index::query
#   mise run test -- --test <file>        run one integration test file, e.g. init_cli (tests/init_cli.rs)
#   mise run test -- --bin <name> / --lib run one binary's tests / library unit tests only
#   mise run test -- -E '<filterset>'     full nextest filterset DSL (https://nexte.st/docs/filtersets)
[tasks.test]
description = "Run tests with nextest (pass -- <nextest args> to scope by name, module, file, or filterset)"
run = "cargo nextest run"
depends = ["check"]
alias = "t"

[tasks."test-all"]
description = "Run all tests including doc-tests (test-utils feature enabled so tests/integration.rs and tests/e2e.rs exercise the gated re-export surface)"
run = "cargo test --workspace --features test-utils"

[tasks.bench]
description = "Run Criterion benchmarks"
run = "cargo bench --features test-utils"

[tasks.lint]
description = "Run all hk linters"
alias = "l"
run = "hk check"

[tasks.fix]
description = "Auto-fix all hk lint issues"
run = "hk fix"

[tasks.fmt]
description = "Format all Rust code (nightly)"
alias = "f"
run = "cargo fmt --all"

[tasks.clippy]
description = "Strict clippy: workspace, all targets, all features. Auto-fixes known lints unless --no-fix."
depends = ["fmt"]
usage = '''
flag "--no-fix" help="Skip auto-fix for known lints"
arg "[lints]" env="CLIPPY_FIX_LINTS" help="Fix list (comma-separated)" default="redundant_clone,needless_collect,or_fun_call"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

declare -a cargo_args
declare -a clippy_args
cargo_args=(--workspace --all-targets --all-features)
clippy_args=(-D warnings)

if [[ "${usage_no_fix:-false}" != "true" ]]; then
  cargo_args+=(--fix --allow-dirty --allow-staged)

  IFS=',' read -ra lints <<< "${usage_lints}"

  for lint in "${lints[@]}"; do
    clippy_args+=(-W "clippy::${lint}")
  done
fi

cargo clippy "${cargo_args[@]}" -- "${clippy_args[@]}"
'''

[tasks.audit]
description = "Run cargo deny audit"
run = "cargo deny check"

[tasks.verify]
description = "Full verification gate: format, lint, clippy, tests, doctests, audit"
alias = "v"
depends = ["fmt", "lint", "clippy", "test-all", "audit"]

[tasks.coverage]
description = "Code coverage with tarpaulin"
run = "cargo tarpaulin --workspace --out html"

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"

[tasks.watch]
description = "Watch and auto-check on changes"
run = "cargo watch -x check -x test"

[tasks.doc]
description = "Build documentation (warnings as errors)"
run = "cargo doc --no-deps"
env = { RUSTDOCFLAGS = "-D warnings" }
sources = ["src/**/*.rs", "Cargo.toml"]
outputs = ["target/doc"]

[tasks.setup]
description = "Install git hooks via hk"
run = "hk install --mise"

[tasks.release]
description = "Release build"
run = "cargo build --release"
alias = "r"
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock"]
outputs = ["target/release/traces-pkm"]

[hooks]
postinstall = "hk install --mise"
